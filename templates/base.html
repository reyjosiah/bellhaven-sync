<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bellhaven · CRM Review</title><style>
:root{--green:#205346;--cream:#f6f5f0;--ink:#22332e;--line:#dce3dd}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 system-ui,sans-serif}header{background:var(--green);color:white;padding:20px 5vw;display:flex;justify-content:space-between;gap:20px}header a{color:white;margin-left:20px}main{max-width:1250px;margin:30px auto;padding:0 24px 70px}h1{font-size:30px;line-height:1.25}h2{font-size:20px}a{color:#165b49}section,.card{background:white;border:1px solid var(--line);border-radius:10px;padding:22px;margin:20px 0}.stats{display:flex;gap:14px;flex-wrap:wrap}.stat{flex:1;min-width:130px;background:white;border:1px solid var(--line);padding:18px;border-radius:8px}.stat strong{display:block;font-size:28px}.muted{color:#66726d;font-size:13px}.badge{display:inline-block;border-radius:5px;background:#ecf2ee;padding:3px 9px;font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{font-size:12px;text-transform:uppercase;color:#657269}button,.button{display:inline-block;border:0;border-radius:6px;background:var(--green);color:white;padding:11px 16px;cursor:pointer;font:inherit;text-decoration:none}button.secondary{background:#e9eee9;color:var(--ink)}button.reject{background:#8e3434}input,select,textarea{font:inherit;padding:8px;border:1px solid #bbc9c0;border-radius:5px}textarea{width:100%;min-height:85px}.notice{border-left:4px solid #b88e32;background:#fff7df;padding:16px;margin:18px 0}.flash{background:#e7efe8;border:1px solid #b6cabb;padding:16px;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f3f5f2;padding:16px;border-radius:6px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.scroll{overflow:auto}details{margin:14px 0}summary{cursor:pointer;font-weight:600}@media(max-width:800px){.columns{display:block}header{display:block}td,th{padding:8px}}
</style></head><body><header><strong>Bellhaven <span style="font-weight:400">/ CRM Review</span></strong><nav><a href="/">Review queue</a><a href="/history">Audit history</a></nav></header><main>{% for m in get_flashed_messages() %}<p class="flash">{{m}}</p>{% endfor %}{% block body %}{% endblock %}</main></body></html>
